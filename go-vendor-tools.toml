# go-vendor-tools configuration for complyctl
# See: https://fedora.gitlab.io/sigs/go/go-vendor-tools/config/
#
# License overrides below are populated by:
#   go_vendor_license --config go-vendor-tools.toml \
#     --path complyctl.spec report --prompt --autofill=auto
#
# Vendor archive is generated by:
#   go_vendor_archive create --config go-vendor-tools.toml complyctl.spec

[archive]

[licensing]
detector = "askalono"
[[licensing.licenses]]
path = "vendor/go.yaml.in/yaml/v3/LICENSE"
sha256sum = "d18f6323b71b0b768bb5e9616e36da390fbd39369a81807cca352de4e4e6aa0b"
expression = "MIT AND (MIT AND Apache-2.0)"

[[licensing.licenses]]
path = "vendor/gopkg.in/yaml.v3/LICENSE"
sha256sum = "d18f6323b71b0b768bb5e9616e36da390fbd39369a81807cca352de4e4e6aa0b"
expression = "MIT AND (MIT AND Apache-2.0)"

# go-localereader has no LICENSE file but declares MIT in README.md
# Upstream: https://github.com/mattn/go-localereader
[[licensing.licenses]]
path = "vendor/github.com/mattn/go-localereader/README.md"
sha256sum = "0c5c52517f13becd7a1e1234f1e8a5ba370f5a5078cee9ac058c2d534e267fcb"
expression = "MIT"
