name: "Setup complyctl environment"
description: "Build complyctl, test provider, and mock OCI registry for integration testing"

runs:
    using: composite
    steps:
        - name: Install dependencies
          run: dnf install -y make git jq curl
          shell: bash

        - name: Configure Git for safe directory
          run: git config --global --add safe.directory /__w/complyctl/complyctl
          shell: bash

        - name: Set up Go
          uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
          with:
              go-version-file: './go.mod'

        - name: Build binaries
          run: make build build-test-provider
          shell: bash

        - name: Install test provider
          run: |
              mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/complytime/providers"
              cp bin/complytime-providers-test "${XDG_DATA_HOME:-$HOME/.local/share}/complytime/providers/"
          shell: bash
