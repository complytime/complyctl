# Cross-repo integration test workflow.
# Builds complyctl from the PR branch, checks out complytime-providers@main,
# builds provider binaries (ampel + opa), installs snappy, ampel, and conftest,
# and runs the cross-repo integration test script to validate the full
# complyctl + provider pipeline end-to-end.
name: Cross-Repo Integration Test

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    cross-repo-integration:
        name: Cross-Repo Integration Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout complyctl
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go (complyctl)
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: './go.mod'

            - name: Build complyctl
              run: make build

            # Intentionally tracks main for HEAD-to-HEAD cross-repo integration.
            # This is a same-org repo under the same maintainer trust boundary.
            - name: Checkout complytime-providers
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: complytime/complytime-providers
                  ref: main
                  path: _providers
                  persist-credentials: false

            - name: Set up Go (complytime-providers)
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: './_providers/go.mod'

            - name: Build complytime-providers
              run: make build
              working-directory: _providers

            # actions/setup-go writes GOTOOLCHAIN=local to $GITHUB_ENV,
            # which prevents Go from auto-downloading a newer toolchain.
            # When the two setup-go calls install different Go versions,
            # the second one can leave a Go binary older than what
            # complyctl's go directive requires. Restoring auto lets Go
            # download the correct toolchain for each module on demand.
            - name: Enable Go toolchain auto-download
              run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

            # Workaround: v1.2.3 writes unexpanded $HOME to GITHUB_PATH
            # when using the default install-dir. Use an absolute path
            # until upstream fix lands (carabiner-dev/actions).
            - name: Install snappy
              uses: carabiner-dev/actions/install/snappy@2a4b2cd115ede14629b03ef7e77586d3269d4c72 # v1.2.3
              with:
                  install-dir: /home/runner/.carabiner

            - name: Install ampel
              uses: carabiner-dev/actions/install/ampel@2a4b2cd115ede14629b03ef7e77586d3269d4c72 # v1.2.3
              with:
                  install-dir: /home/runner/.carabiner

            - name: Install conftest
              run: go install github.com/open-policy-agent/conftest@v0.68.2

            - name: Run cross-repo integration test
              env:
                  PROVIDERS_BIN_DIR: ${{ github.workspace }}/_providers/bin
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: make test-cross-repo PROVIDERS_BIN_DIR="${PROVIDERS_BIN_DIR}"
