name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

jobs:
  call_reusable_ci:
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@bd3718a218d649b093269fe4a979c4a4632dfad2 # v0.8.0
    permissions:
      contents: read
      issues: read
      pull-requests: read
