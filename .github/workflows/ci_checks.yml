name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

jobs:
  call_reusable_ci:
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@0c784711926c9864f027ec565fd7c06a382d80f8 # v0.7.1
    permissions:
      contents: read
      issues: read
      pull-requests: read
