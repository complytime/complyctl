# Release
# =======
# Release pipeline triggered via workflow_dispatch.
# Delegates to org-infra reusable workflows for preflight
# validation and GoReleaser execution with supply chain
# artifacts (cosign signatures and SBOMs).
#
# Preflight validates semver format, tag uniqueness (with
# re-run resilience), semver ordering, CI check status,
# and unreleased commits before creating an annotated tag.
#
# See: https://github.com/complytime/complyctl/issues/699
# Fixes: https://github.com/complytime/complyctl/issues/654
# Fixes: https://github.com/complytime/complyctl/issues/655

name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'The tag to release (e.g., v1.2.3)'
                required: true
                type: string

permissions:
    contents: none
    id-token: none

jobs:
    preflight:
        name: Preflight
        uses: complytime/org-infra/.github/workflows/reusable_release_preflight.yml@7e13c504ba68fd7b80634e367a8170fb4041663b # v0.7.0
        with:
            tag: ${{ inputs.tag }}
            ci_checks: '["unit-test", "e2e-test", "integration-test"]'
        permissions:
            contents: write
            checks: read

    release:
        name: Release
        needs: preflight
        if: needs.preflight.outputs.tag != ''
        uses: complytime/org-infra/.github/workflows/reusable_release_goreleaser.yml@7e13c504ba68fd7b80634e367a8170fb4041663b # v0.7.0
        with:
            tag: ${{ needs.preflight.outputs.tag }}
        permissions:
            contents: write
            id-token: write
