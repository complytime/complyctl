name: behavioral-assessment

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    behavioral-assessment:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            security-events: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: './go.mod'

            - name: Build binaries
              run: make build build-test-provider build-behavioral-report

            - name: Run behavioral assessment
              run: make test-behavioral

            - name: Upload SARIF to Code Scanning
              uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              if: always()
              with:
                  sarif_file: governance/reports/behavioral-report.sarif.json
                  category: behavioral-assessment
