name: behavioral-assessment

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false # push-to-main only; SARIF uploads must complete

permissions:
    contents: read # read repository contents

jobs:
    behavioral-assessment:
        name: Behavioral Assessment
        runs-on: ubuntu-latest
        permissions:
            contents: read          # check out repository code
            actions: read           # required to upload SARIF to CodeQL (https://github.com/github/codeql-action/issues/2117)
            security-events: write  # upload SARIF results to the security tab
        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: './go.mod'

            - name: Build binaries
              run: make build build-test-provider build-behavioral-report

            - name: Run behavioral assessment
              run: make test-behavioral

            - name: Upload SARIF to Code Scanning
              uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
              if: always()
              with:
                  sarif_file: governance/reports/behavioral-report.sarif.json
                  category: behavioral-assessment
